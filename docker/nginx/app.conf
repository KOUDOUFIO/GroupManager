# Remplacez VOTRE-DOMAINE.com par votre vrai nom de domaine (les deux occurrences)
# avant le premier lancement, puis suivez docker/nginx/init-letsencrypt.sh
# pour obtenir le certificat HTTPS.

server {
    listen 80;
    server_name VOTRE-DOMAINE.com;

    # Requis par Let's Encrypt pour valider le domaine (methode webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name VOTRE-DOMAINE.com;

    ssl_certificate     /etc/letsencrypt/live/VOTRE-DOMAINE.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/VOTRE-DOMAINE.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    # Django ne sert pas /media/ en production (DEBUG=0) : nginx le fait
    # directement depuis le volume partage avec le service web.
    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
