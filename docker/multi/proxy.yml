# Reverse proxy partage par toutes les installations clientes :
# nginx (HTTPS) + certbot (renouvellement automatique des certificats).
#
# Ne pas lancer a la main : `docker/multi/kotiza-clients.sh proxy-up`.
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # Recharge nginx toutes les 6h pour prendre en compte les certificats
    # renouveles par certbot.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'
    volumes:
      - ${CLIENTS_ROOT}/nginx:/etc/nginx/conf.d:ro
      - ${CLIENTS_ROOT}:/srv/clients:ro
      - ${CLIENTS_ROOT}/certbot/conf:/etc/letsencrypt:ro
      - ${CLIENTS_ROOT}/certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - proxy

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ${CLIENTS_ROOT}/certbot/conf:/etc/letsencrypt
      - ${CLIENTS_ROOT}/certbot/www:/var/www/certbot
    entrypoint: >-
      sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

networks:
  proxy:
    name: kotiza_proxy
