<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-label="Kotiza">
  <g>
  <defs>
    <linearGradient id="kzf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f7a3a"/>
      <stop offset="1" stop-color="#063d1c"/>
    </linearGradient>
    <linearGradient id="kzf-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#f5b82e"/>
      <stop offset="1" stop-color="#c7851a"/>
    </linearGradient>
    <radialGradient id="kzf-glow" cx="0.2" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#9be15d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9be15d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#kzf-bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#kzf-glow)"/>
  <!-- Piece d'or : l'anneau de la cotisation commune -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#kzf-gold)" stroke-width="3.4"/>
  <!-- Monogramme K : un fut et deux branches, la haute monte comme une courbe de croissance -->
  <rect x="22.5" y="21" width="5" height="22" rx="1.6" fill="url(#kzf-gold)"/>
  <path d="M27.5 33.2 L37.2 21.6 a1.6 1.6 0 0 1 1.2-.6 h3.4 a.8.8 0 0 1 .6 1.3 L31.2 35.8 Z" fill="url(#kzf-gold)"/>
  <path d="M30.6 32.4 L42.6 41.7 a.7.7 0 0 1-.4 1.3 h-4 a1.6 1.6 0 0 1-1-.35 L27.5 35.4 Z" fill="url(#kzf-gold)"/>
  <!-- Trois membres autour de la piece -->
  <circle cx="32" cy="11" r="3.3" fill="#fde68a" stroke="#0b4a22" stroke-width="1.2"/>
  <circle cx="13.8" cy="42.5" r="3.3" fill="#fde68a" stroke="#0b4a22" stroke-width="1.2"/>
  <circle cx="50.2" cy="42.5" r="3.3" fill="#fde68a" stroke="#0b4a22" stroke-width="1.2"/>
</g>
  <text x="78" y="44" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-1" fill="#0b3d1f">Koti<tspan fill="#c7851a">za</tspan></text>
</svg>
