<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Cotisation confirmée sur téléphone, pièces d'or et registre">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14572c"/>
      <stop offset="1" stop-color="#062e16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#f5b82e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f5b82e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.55">
      <stop offset="0" stop-color="#9be15d" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#9be15d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#f5b82e"/>
      <stop offset="1" stop-color="#c7851a"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9981f"/>
      <stop offset="1" stop-color="#a86b12"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#021a0b" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>
  <g opacity="0.07" stroke="#ffffff" stroke-width="2">
    <path d="M0 200H1600M0 400H1600M0 600H1600M0 800H1600"/>
    <path d="M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/>
  </g>

  <!-- Registre de la tontine -->
  <g filter="url(#shadow)" transform="rotate(-8 430 560)">
    <rect x="200" y="300" width="460" height="560" rx="28" fill="#fffdf6"/>
    <rect x="200" y="300" width="64" height="560" rx="28" fill="#c7851a"/>
    <rect x="236" y="300" width="28" height="560" fill="#c7851a"/>
    <text x="300" y="390" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0b3d1f">Cotisations</text>
    <g font-family="Inter, Arial, sans-serif" font-size="24" fill="#334155">
      <g transform="translate(300 450)">
        <circle cx="14" cy="-8" r="16" fill="#16a34a"/><path d="m6 -8 6 6 11 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="44" y="-18" width="170" height="16" rx="8" fill="#cbd5e1"/><rect x="250" y="-18" width="70" height="16" rx="8" fill="#94a3b8"/>
      </g>
      <g transform="translate(300 525)">
        <circle cx="14" cy="-8" r="16" fill="#16a34a"/><path d="m6 -8 6 6 11 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="44" y="-18" width="140" height="16" rx="8" fill="#cbd5e1"/><rect x="250" y="-18" width="70" height="16" rx="8" fill="#94a3b8"/>
      </g>
      <g transform="translate(300 600)">
        <circle cx="14" cy="-8" r="16" fill="#16a34a"/><path d="m6 -8 6 6 11 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="44" y="-18" width="190" height="16" rx="8" fill="#cbd5e1"/><rect x="250" y="-18" width="70" height="16" rx="8" fill="#94a3b8"/>
      </g>
      <g transform="translate(300 675)">
        <circle cx="14" cy="-8" r="16" fill="#f59e0b"/><rect x="7" y="-10" width="14" height="4" rx="2" fill="#fff"/>
        <rect x="44" y="-18" width="160" height="16" rx="8" fill="#cbd5e1"/><rect x="250" y="-18" width="70" height="16" rx="8" fill="#94a3b8"/>
      </g>
      <g transform="translate(300 750)">
        <circle cx="14" cy="-8" r="16" fill="#16a34a"/><path d="m6 -8 6 6 11 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="44" y="-18" width="120" height="16" rx="8" fill="#cbd5e1"/><rect x="250" y="-18" width="70" height="16" rx="8" fill="#94a3b8"/>
      </g>
    </g>
  </g>

  <!-- Telephone : cotisation confirmee -->
  <g filter="url(#shadow)">
    <rect x="640" y="130" width="380" height="760" rx="56" fill="#0f172a"/>
    <rect x="658" y="148" width="344" height="724" rx="42" fill="url(#screen)"/>
    <rect x="780" y="166" width="100" height="22" rx="11" fill="#0f172a"/>
    <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
      <circle cx="830" cy="330" r="74" fill="#dcfce7"/>
      <circle cx="830" cy="330" r="52" fill="#16a34a"/>
      <path d="m804 330 18 18 34 -38" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="830" y="460" font-size="30" font-weight="700" fill="#0b3d1f">Cotisation confirmée</text>
      <text x="830" y="540" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="50" font-weight="800" fill="#0f172a">5 000 FCFA</text>
      <text x="830" y="590" font-size="24" fill="#64748b">Tontine · septembre</text>
      <rect x="700" y="640" width="260" height="70" rx="35" fill="#15803d"/>
      <text x="830" y="684" font-size="26" font-weight="700" fill="#ffffff">Reçu PDF</text>
      <rect x="700" y="730" width="260" height="16" rx="8" fill="#e2e8f0"/>
      <rect x="740" y="760" width="180" height="16" rx="8" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- Pieces d'or -->
  <g filter="url(#shadow)">
    <g transform="translate(1190 700)">
      <ellipse cx="0" cy="120" rx="150" ry="44" fill="url(#goldSide)"/>
      <rect x="-150" y="40" width="300" height="80" fill="url(#goldSide)"/>
      <ellipse cx="0" cy="40" rx="150" ry="44" fill="url(#gold)"/>
      <ellipse cx="0" cy="40" rx="104" ry="28" fill="none" stroke="#c7851a" stroke-width="6" opacity="0.6"/>
      <rect x="-150" y="-40" width="300" height="80" fill="url(#goldSide)"/>
      <ellipse cx="0" cy="-40" rx="150" ry="44" fill="url(#gold)"/>
      <ellipse cx="0" cy="-40" rx="104" ry="28" fill="none" stroke="#c7851a" stroke-width="6" opacity="0.6"/>
      <rect x="-150" y="-120" width="300" height="80" fill="url(#goldSide)"/>
      <ellipse cx="0" cy="-120" rx="150" ry="44" fill="url(#gold)"/>
      <ellipse cx="0" cy="-120" rx="104" ry="28" fill="none" stroke="#c7851a" stroke-width="6" opacity="0.6"/>
      <text x="0" y="-106" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#8a5a0f">K</text>
    </g>
    <g transform="translate(1390 380) rotate(18)">
      <circle r="92" fill="url(#goldSide)"/>
      <circle r="84" fill="url(#gold)"/>
      <circle r="62" fill="none" stroke="#c7851a" stroke-width="6" opacity="0.6"/>
      <text y="18" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="56" font-weight="800" fill="#8a5a0f">K</text>
    </g>
    <g transform="translate(1150 250) rotate(-14)">
      <circle r="58" fill="url(#goldSide)"/>
      <circle r="52" fill="url(#gold)"/>
      <circle r="38" fill="none" stroke="#c7851a" stroke-width="5" opacity="0.6"/>
    </g>
  </g>
</svg>
