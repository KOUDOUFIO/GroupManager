version: "3.9"

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: ${DB_pgAdmin}
      POSTGRES_USER: ${DB_KOUDOUFIO}
      POSTGRES_PASSWORD: ${DB_postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: /app/docker/entrypoint.sh
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
