name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: kotiza_test
          POSTGRES_USER: kotiza
          POSTGRES_PASSWORD: kotiza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kotiza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # Tests sur Postgres, comme en production (et non SQLite).
      DATABASE_URL: postgres://kotiza:kotiza@localhost:5432/kotiza_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test -v 2
